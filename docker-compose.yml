# ==============================================================================
# File: docker-compose.yml
# Tujuan: Orkestrasi multi-container Docker (PHP-FPM 8.2, Nginx, MySQL 8.0) untuk Menuju Haramain
# Dipakai Oleh: Pengembang sistem / environment runner (docker compose up -d)
# Dependensi Utama: Dockerfile (app), nginx:alpine (web), mysql:8.0 (db)
# Daftar Service Utama: app (PHP 8.2 FPM), web (Nginx reverse proxy), db (MySQL 8.0)
# Side Effect: Menjalankan container, port mapping (8010, 3310), alokasi persistent volume & network bridge
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: menuju_haramain_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - menuju_haramain_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: menuju_haramain_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8010}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - menuju_haramain_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: menuju_haramain_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-menuju_haramain}
      MYSQL_USER: ${DB_USERNAME:-haramain_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-haramain_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-haramain_root_secret}
    ports:
      - "${FORWARD_DB_PORT:-3310}:3306"
    volumes:
      - menuju_haramain_db_data:/var/lib/mysql
    networks:
      - menuju_haramain_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-haramain_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  menuju_haramain_net:
    driver: bridge

volumes:
  menuju_haramain_db_data:
    driver: local
