# ==============================================================================
# File: docker/nginx/default.conf
# Tujuan: Konfigurasi Virtual Host Nginx reverse proxy untuk Menuju Haramain
# Dipakai Oleh: Container menuju_haramain_web (Nginx reverse proxy)
# Dependensi Utama: Container menuju_haramain_app (FastCGI backend port 9000)
# Daftar Blok/Direktif Utama: server, location /, location ~ \.php$
# Side Effect: Menerima HTTP traffic port 80 dan meneruskan request PHP ke container app
# ==============================================================================

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    client_max_body_size 32M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

