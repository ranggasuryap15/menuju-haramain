; ==============================================================================
; File: docker/php/local.ini
; Tujuan: Kustomisasi konfigurasi runtime PHP 8.2 untuk project Tabungan Umroh Menuju Haramain
; Dipakai Oleh: Container menuju_haramain_app (PHP-FPM)
; Dependensi Utama: PHP 8.2 FPM runtime
; Daftar Pengaturan Utama: upload_max_filesize, post_max_size, memory_limit, max_execution_time
; Side Effect: Mengubah alokasi memori PHP dan batas ukuran upload bukti transfer
; ==============================================================================

[PHP]
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300
date.timezone = Asia/Jakarta

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

